[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgesense-lab"
version = "0.1.0"
description = "Validation-first serial capture and quality auditing for ESP32-S3 sensing research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Taha Mohammadi"}]
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
edgesense = "edgesense.cli:main"

[tool.setuptools]
package-dir = {"" = "host"}

[tool.setuptools.packages.find]
where = ["host"]
