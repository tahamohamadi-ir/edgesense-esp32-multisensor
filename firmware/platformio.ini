; ESP32-S3 board is only an approximate target, NOT a verified PCB pin map.
; Do not flash/connect peripherals until hardware mapping and supply have been inspected.
[platformio]
default_envs = edgesense

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D BOARD_HAS_PSRAM
lib_deps =
  adafruit/Adafruit MPU6050
  adafruit/Adafruit MLX90614 Library
  adafruit/Adafruit Unified Sensor
  adafruit/Adafruit BusIO

[env:edgesense]
src_filter = +<main.cpp> -<ppg_motion.cpp>
lib_deps =
  ${env.lib_deps}
  paulstoffregen/OneWire
  milesburton/DallasTemperature

[env:ppg_motion]
src_filter = -<main.cpp> +<ppg_motion.cpp>
lib_deps =
  ${env.lib_deps}
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
